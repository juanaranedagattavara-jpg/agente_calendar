services:
  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      API_KEY: ${API_KEY}
      PORT: ${PORT:-3001}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
    labels:
      - traefik.enable=true
      - traefik.http.routers.julieta-dashboard.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.julieta-dashboard.entrypoints=websecure
      - traefik.http.routers.julieta-dashboard.tls.certresolver=letsencrypt
      - traefik.http.services.julieta-dashboard.loadbalancer.server.port=${PORT:-3001}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:${PORT:-3001}/health"]
      interval: 120s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
